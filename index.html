<style>
  :root { --bg: #0e0b12; --line: #2c2433; --ink: #e9e2ea; --dim: #6f6575; --accent: #cfa96a; --bad: #c46a7c; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         display: grid; place-items: center; padding: 16px; }
  form { display: flex; flex-direction: column; align-items: center; gap: 22px; width: min(100%, 300px); }
  svg { width: 28px; height: 28px; color: var(--dim); transition: color .4s; }
  .row { display: flex; width: 100%; gap: 8px; }
  input { flex: 1; min-width: 0; font: inherit; font-size: 16px; text-align: center; letter-spacing: .12em; color: var(--ink);
          background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 12px 16px; outline: none; transition: border-color .2s; }
  input:focus { border-color: var(--dim); }
  button { width: 46px; flex: none; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--dim);
           font-size: 18px; cursor: pointer; transition: color .2s, border-color .2s; }
  button:hover, button:focus-visible { color: var(--ink); border-color: var(--dim); outline: none; }
  .bad input { border-color: var(--bad); }
  .bad { animation: shake .4s; }
  .ok svg { color: var(--accent); }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
